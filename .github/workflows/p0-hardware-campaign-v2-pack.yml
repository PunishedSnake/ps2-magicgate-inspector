name: P0 Hardware Campaign Pack v2

on:
  workflow_dispatch:
  push:
    branches:
      - perf/p0-hardware-campaign
    paths:
      - '.github/workflows/p0-hardware-campaign-v2-pack.yml'
      - 'docs/P0_HARDWARE_CAMPAIGN_V2.md'

permissions:
  contents: read
  actions: read

env:
  ORIGINAL_RUN_ID: '32707959479'
  ORIGINAL_SOURCE_SHA: a81ca03dce237fbbb48c52ce39adc3319cc0fea1
  ORIGINAL_ARTIFACT_ID: '9512980209'
  ORIGINAL_ARTIFACT_DIGEST: sha256:c3e05adc3c24861eb3144265e40999c3297822cc3924eff0ec1eb306121da250

  SAFE_V1_RUN_ID: '33910509140'
  SAFE_V1_SOURCE_SHA: 54b1e6e8a3bbe79652390198bec4917e18738471
  SAFE_V1_ARTIFACT_ID: '9951188483'
  SAFE_V1_ARTIFACT_DIGEST: sha256:66a61f2c8f27576dfa93e227ea96a3ab53e07b67eb63a9518fda7f24334515bc

  SAFE_V2_RUN_ID: '33914313656'
  SAFE_V2_SOURCE_SHA: 445ddd31efc6f9c88f2652dcfafee6ca8ff32808
  SAFE_V2_ARTIFACT_ID: '9952574690'
  SAFE_V2_ARTIFACT_DIGEST: sha256:2edfd7e36cd2d056b64af286c0de58042a790d2897ed8f1db41f3c0fcddd6a09

  ASYNC_V2_RUN_ID: '33914598481'
  ASYNC_V2_SOURCE_SHA: a8fae27a9a8da3aa0ff015065429e6b6ddebe26b
  ASYNC_V2_ARTIFACT_ID: '9952702690'
  ASYNC_V2_ARTIFACT_DIGEST: sha256:52cd486e3d4ccd8b4993f215969c465eed30fa0a21a0417e5125a5508e074bf5

jobs:
  assemble:
    name: Assemble immutable hardware pack v2
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout campaign metadata
        uses: actions/checkout@v4

      - name: Verify exact upstream artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/campaign-v2-meta
          verify_artifact() {
            label="$1"; id="$2"; digest="$3"; run_id="$4"; source_sha="$5"
            out=".build/campaign-v2-meta/$label.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" > "$out"
            python3 - "$out" "$id" "$digest" "$run_id" "$source_sha" <<'PY'
          import json, sys
          path, artifact_id, digest, run_id, source_sha = sys.argv[1:]
          data = json.load(open(path, 'r', encoding='utf-8'))
          assert data['id'] == int(artifact_id)
          assert data.get('expired') is False
          assert data.get('digest') == digest
          run = data.get('workflow_run') or {}
          assert run.get('id') == int(run_id)
          assert run.get('head_sha') == source_sha
          PY
          }
          verify_artifact original "$ORIGINAL_ARTIFACT_ID" "$ORIGINAL_ARTIFACT_DIGEST" "$ORIGINAL_RUN_ID" "$ORIGINAL_SOURCE_SHA"
          verify_artifact safe-v1 "$SAFE_V1_ARTIFACT_ID" "$SAFE_V1_ARTIFACT_DIGEST" "$SAFE_V1_RUN_ID" "$SAFE_V1_SOURCE_SHA"
          verify_artifact safe-v2 "$SAFE_V2_ARTIFACT_ID" "$SAFE_V2_ARTIFACT_DIGEST" "$SAFE_V2_RUN_ID" "$SAFE_V2_SOURCE_SHA"
          verify_artifact async-v2 "$ASYNC_V2_ARTIFACT_ID" "$ASYNC_V2_ARTIFACT_DIGEST" "$ASYNC_V2_RUN_ID" "$ASYNC_V2_SOURCE_SHA"

      - name: Download exact upstream packs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root=.build/campaign-v2
          rm -rf "$root"
          mkdir -p "$root/zips" "$root/safe-v1" "$root/safe-v2" "$root/async-v2" "$root/original"
          download_unpack() {
            id="$1"; label="$2"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$root/zips/$label.zip"
            unzip -tq "$root/zips/$label.zip"
            unzip -q "$root/zips/$label.zip" -d "$root/$label"
          }
          download_unpack "$SAFE_V1_ARTIFACT_ID" safe-v1
          download_unpack "$SAFE_V2_ARTIFACT_ID" safe-v2
          download_unpack "$ASYNC_V2_ARTIFACT_ID" async-v2
          download_unpack "$ORIGINAL_ARTIFACT_ID" original
          sha256sum "$root/zips"/*.zip > "$root/zips/DOWNLOADED_ZIP_SHA256.txt"

      - name: Validate expected ELF families
        shell: bash
        run: |
          set -euo pipefail
          root=.build/campaign-v2
          require_one() {
            scope="$1"; pattern="$2"
            count=$(find "$root/$scope" -type f -name "$pattern" | wc -l)
            if [ "$count" -ne 1 ]; then
              echo "Expected one $pattern in $scope, found $count" >&2
              find "$root/$scope" -type f -name '*.ELF' -print | sort >&2
              exit 1
            fi
          }
          require_one safe-v1 'BASE-c88f507.ELF'
          for batch in 16 32 64; do require_one safe-v1 "FINAL-SAFE-conflict${batch}.ELF"; done
          require_one safe-v2 'BASE-c88f507.ELF'
          for batch in 16 32 64; do require_one safe-v2 "FINAL-SAFE-V2-conflict${batch}.ELF"; done
          for batch in 16 32 64; do
            require_one async-v2 "FINAL-ASYNC-V2-SOURCE-SYNC-conflict${batch}.ELF"
            require_one async-v2 "FINAL-ASYNC-V2-READ-conflict${batch}.ELF"
            require_one async-v2 "FINAL-ASYNC-V2-WRITE-conflict${batch}.ELF"
          done
          find "$root/original" -type f -print | sort > "$root/ORIGINAL-541-CONTENTS.txt"

      - name: Flatten hardware payloads
        shell: bash
        run: |
          set -euo pipefail
          root=.build/campaign-v2
          out="$root/HARDWARE_ELFS"
          mkdir -p "$out"
          copy_unique() {
            scope="$1"; pattern="$2"; output="$3"
            src=$(find "$root/$scope" -type f -name "$pattern" -print -quit)
            test -n "$src"
            cp "$src" "$out/$output"
          }
          copy_unique safe-v1 'BASE-c88f507.ELF' '01_BASE-c88f507.ELF'
          copy_unique safe-v1 'FINAL-SAFE-conflict16.ELF' '02_FINAL-SAFE-V1-conflict16.ELF'
          copy_unique safe-v1 'FINAL-SAFE-conflict32.ELF' '03_FINAL-SAFE-V1-conflict32.ELF'
          copy_unique safe-v1 'FINAL-SAFE-conflict64.ELF' '04_FINAL-SAFE-V1-conflict64.ELF'
          copy_unique safe-v2 'FINAL-SAFE-V2-conflict16.ELF' '05_FINAL-SAFE-V2-conflict16.ELF'
          copy_unique safe-v2 'FINAL-SAFE-V2-conflict32.ELF' '06_FINAL-SAFE-V2-conflict32.ELF'
          copy_unique safe-v2 'FINAL-SAFE-V2-conflict64.ELF' '07_FINAL-SAFE-V2-conflict64.ELF'
          for batch in 16 32 64; do
            copy_unique async-v2 "FINAL-ASYNC-V2-SOURCE-SYNC-conflict${batch}.ELF" "10_FINAL-V2-SOURCE-SYNC-conflict${batch}.ELF"
            copy_unique async-v2 "FINAL-ASYNC-V2-READ-conflict${batch}.ELF" "20_FINAL-V2-ASYNC-READ-conflict${batch}.ELF"
            copy_unique async-v2 "FINAL-ASYNC-V2-WRITE-conflict${batch}.ELF" "30_FINAL-V2-ASYNC-WRITE-conflict${batch}.ELF"
          done
          cp "$root/zips/original.zip" "$out/00_ORIGINAL-541-exact-artifact.zip"
          cp "$root/ORIGINAL-541-CONTENTS.txt" "$out/00_ORIGINAL-541-CONTENTS.txt"
          sha256sum "$out"/*.ELF "$out"/*.zip > "$out/HARDWARE_PAYLOAD_SHA256.txt"

      - name: Generate staged campaign sheets
        shell: bash
        run: |
          set -euo pipefail
          root=.build/campaign-v2
          cat > "$root/START_HERE_V2.txt" <<'EOF'
          PS2 Memory Card Inspector - P0 hardware campaign v2
          ====================================================

          Correctness is a hard gate. A candidate with corruption, wrong CRC/hash,
          failed verify/restore, new fileXio/mc/SIF error, hang or reset is excluded.

          Stage 0 - smoke
          ---------------
          Run one representative operation with BASE, SAFE-V1 conflict32,
          SAFE-V2 conflict32, V2 SOURCE-SYNC conflict32, V2 ASYNC-READ conflict32,
          and V2 ASYNC-WRITE conflict32. Also smoke the exact ORIGINAL-541 artifact.

          Stage 1 - isolate trusted quick-reopen elision
          ------------------------------------------------
          Selected-save import workload only:
            SAFE-V1 conflict32 vs SAFE-V2 conflict32
          Start with 5 alternating runs each. If correctness is clean and the delta
          is measurable, extend to at least 20 valid runs each.

          Stage 2 - choose FINAL-SAFE-v2 conflict batch
          ------------------------------------------------
          Compare SAFE-V2 conflict16/32/64 with 5 rotating screening runs each.
          Rank whole-operation time first and p95/p99/max second; use service counters
          to explain the result. Do not assume 64 wins merely because it is larger.

          Stage 3 - async overlap on the Stage-2 winner
          ------------------------------------------------
          Compare SAME-SOURCE V2 SOURCE-SYNC / ASYNC-READ / ASYNC-WRITE for the
          winning conflict batch. Start with 5 rotating runs, then at least 20 valid
          runs for surviving candidates. Never compare different conflict batches
          while claiming to isolate async.

          Stage 4 - historical/project gain
          -----------------------------------
          Compare ORIGINAL-541, BASE-c88f507, winning SAFE-V2 and winning async-v2
          candidate if async qualifies. Record p50/p95/p99/max, correctness and all
          workload metadata.

          Stage 5 - whole-system re-profile
          -----------------------------------
          After selecting a winner, profile again. The bottleneck may have moved.
          EOF

          cat > "$root/STAGE1_TRUSTED_VERIFY.csv" <<'EOF'
          sequence,variant,run_index,operation_ticks,image_io_read_bytes,image_io_read_ticks,p50_ticks,p95_ticks,p99_ticks,max_ticks,correctness_hash,verify_result,notes
          1,FINAL-SAFE-V1-conflict32,,,,,,,,,,,
          2,FINAL-SAFE-V2-conflict32,,,,,,,,,,,
          EOF

          cat > "$root/STAGE2_CONFLICT.csv" <<'EOF'
          sequence,variant,run_index,operation_ticks,p50_ticks,p95_ticks,p99_ticks,max_ticks,correctness_hash,verify_result,notes
          1,FINAL-SAFE-V2-conflict16,,,,,,,,,
          2,FINAL-SAFE-V2-conflict32,,,,,,,,,
          3,FINAL-SAFE-V2-conflict64,,,,,,,,,
          EOF

          cat > "$root/STAGE3_ASYNC.csv" <<'EOF'
          sequence,variant,conflict_batch,run_index,operation_ticks,async_submits,async_ready,async_waits,async_wait_ticks,p50_ticks,p95_ticks,p99_ticks,max_ticks,correctness_hash,verify_result,notes
          1,FINAL-V2-SOURCE-SYNC,,,,,,,,,,,,,,
          2,FINAL-V2-ASYNC-READ,,,,,,,,,,,,,,
          3,FINAL-V2-ASYNC-WRITE,,,,,,,,,,,,,,
          EOF

      - name: Bundle provenance
        shell: bash
        run: |
          set -euo pipefail
          root=.build/campaign-v2
          mkdir -p "$root/PROVENANCE"
          cp .build/campaign-v2-meta/*.json "$root/PROVENANCE/"
          cp docs/P0_HARDWARE_CAMPAIGN_V2.md "$root/PROVENANCE/"
          cp "$root/zips/DOWNLOADED_ZIP_SHA256.txt" "$root/PROVENANCE/"
          cat > "$root/PROVENANCE/CAMPAIGN_V2.txt" <<EOF
          campaign_sha=$GITHUB_SHA
          original_artifact_id=$ORIGINAL_ARTIFACT_ID
          safe_v1_artifact_id=$SAFE_V1_ARTIFACT_ID
          safe_v2_artifact_id=$SAFE_V2_ARTIFACT_ID
          async_v2_artifact_id=$ASYNC_V2_ARTIFACT_ID
          EOF

      - name: Upload complete hardware campaign v2
        uses: actions/upload-artifact@v4
        with:
          name: PS2-MCI-P0-hardware-campaign-v2-${{ github.sha }}
          path: .build/campaign-v2/
          if-no-files-found: error
          retention-days: 30
