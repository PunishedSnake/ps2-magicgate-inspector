name: P0 Image FS Cluster Batch

on:
  workflow_dispatch:
  push:
    branches:
      - perf/p0-image-fs-cluster-batch
    paths:
      - 'src/card_image_fs.c'
      - 'tools/patch_card_image_fs_cluster_batch.py'
      - '.github/workflows/p0-image-fs-cluster-batch.yml'

permissions:
  contents: read

env:
  DIRECT_SLOT_BASE_SHA: c88f50787b15bf253e11e5bc75017ac1ed4cdd79
  PS2SDK_SECURITY_COMMIT: a13b5971ec0e39c7ba8b8559b80a4e81c8425352

jobs:
  build-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout cluster-batch experiment
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Materialize baseline and probe worktrees
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$DIRECT_SLOT_BASE_SHA"
          mkdir -p .build/worktrees artifacts/p0-image-fs-cluster-batch
          git worktree add --detach .build/worktrees/baseline "$DIRECT_SLOT_BASE_SHA"
          git worktree add --detach .build/worktrees/probe "$GITHUB_SHA"

      - name: Stage pinned PS2SDK personalities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/ps2sdk2-mg .build/ps2sdk2-secr14 .build/ps2sdk2-raw
          docker pull ps2dev/ps2dev:v2.0.0
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e PS2SDK_SECURITY_COMMIT="$PS2SDK_SECURITY_COMMIT" \
            ps2dev/ps2dev:v2.0.0 sh -c 'set -eu; \
              apk add --no-cache git python3 build-base >/dev/null; \
              for f in freesio2.irx freepad.irx mcman.irx mcserv.irx; do cp "/usr/local/ps2dev/ps2sdk/iop/irx/$f" "/work/.build/ps2sdk2-mg/$f"; done; \
              git init -q /tmp/ps2sdk-src; \
              git -C /tmp/ps2sdk-src remote add origin https://github.com/ps2dev/ps2sdk.git; \
              git -C /tmp/ps2sdk-src fetch -q --depth 1 origin "$PS2SDK_SECURITY_COMMIT"; \
              git -C /tmp/ps2sdk-src checkout -q FETCH_HEAD; \
              python3 /work/tools/patch_secrman14_diag.py /tmp/ps2sdk-src/iop/security/secrman; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/security/secrman clean all; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/security/secrsif clean all; \
              cp /tmp/ps2sdk-src/iop/security/secrman/irx/secrman.irx /work/.build/ps2sdk2-secr14/secrman.irx; \
              cp /tmp/ps2sdk-src/iop/security/secrsif/irx/secrsif.irx /work/.build/ps2sdk2-secr14/secrsif.irx; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/memorycard/mcman clean; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/memorycard/mcman all MCMAN_BUILDING_XMCMAN=0 MCMAN_BUILDING_XMCMAN_V2=0; \
              python3 /work/tools/patch_raw_mcserv_ports.py /tmp/ps2sdk-src/iop/memorycard/mcserv/src/mcserv.c; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/memorycard/mcserv clean; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/memorycard/mcserv all MCMAN_BUILDING_XMCSERV=0; \
              cp /tmp/ps2sdk-src/iop/memorycard/mcman/irx/mcman.irx /work/.build/ps2sdk2-raw/mcman.irx; \
              cp /tmp/ps2sdk-src/iop/memorycard/mcserv/irx/mcserv.irx /work/.build/ps2sdk2-raw/mcserv.irx'
          for tree in .build/worktrees/baseline .build/worktrees/probe; do
            mkdir -p "$tree/.build"
            cp -a .build/ps2sdk2-mg "$tree/.build/"
            cp -a .build/ps2sdk2-secr14 "$tree/.build/"
            cp -a .build/ps2sdk2-raw "$tree/.build/"
          done

      - name: Apply guarded candidate overlays
        shell: bash
        run: |
          set -euo pipefail
          cp src/card_image_fs.c artifacts/p0-image-fs-cluster-batch/card_image_fs-before.c
          python3 tools/patch_card_image_fs_cluster_batch.py src/card_image_fs.c
          python3 .build/worktrees/probe/tools/patch_card_image_fs_cluster_batch.py --probe .build/worktrees/probe/src/card_image_fs.c
          diff -u artifacts/p0-image-fs-cluster-batch/card_image_fs-before.c src/card_image_fs.c > artifacts/p0-image-fs-cluster-batch/CLUSTER_BATCH.patch || test $? -eq 1
          python3 - <<'PY'
          from pathlib import Path
          text = Path('src/card_image_fs.c').read_text()
          start = text.index('static int ReadCluster(')
          end = text.index('static int FatEntry(', start)
          fn = text[start:end]
          assert fn.count('fileXioLseek(') == 1, fn
          assert 'ReadExact(image->fd, buffer, FS_MAX_CLUSTER_BYTES)' in fn
          assert 'ReadExact(image->fd, ClusterBatchRaw, physical_bytes)' in fn
          assert 'ClusterBatchRaw + FS_PS2_STRIDE' in fn
          assert 'for (i = 0; i < image->sb.pages_per_cluster; i++)' in fn
          print('ReadCluster static transport contract: PASS')
          PY

      - name: Build baseline, timing candidate and execution probe
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work \
            ps2dev/ps2dev:v2.0.0 sh -c 'set -eu; \
              apk add --no-cache build-base >/dev/null; \
              FLAGS="R5900_BENCH=0 RAW_BULK_PAGES=16 RAW_BULK_ASYNC=0 IMAGE_READ_PAGES=32 IMAGE_WRITE_PAGES=32 IMAGE_WRITE_ASYNC=0 IMAGE_WRITE_PROBE=0"; \
              build_one() { \
                path="$1"; name="$2"; \
                cd "/work/$path"; \
                make $FLAGS MC_INSPECTOR.ELF; \
                cp MC_INSPECTOR.ELF "/work/artifacts/p0-image-fs-cluster-batch/$name.ELF"; \
                cp src/card_image_fs.o "/work/artifacts/p0-image-fs-cluster-batch/$name-card_image_fs.o"; \
                mips64r5900el-ps2-elf-size MC_INSPECTOR.ELF src/card_image_fs.o > "/work/artifacts/p0-image-fs-cluster-batch/$name.size.txt"; \
                mips64r5900el-ps2-elf-nm -S src/card_image_fs.o > "/work/artifacts/p0-image-fs-cluster-batch/$name.symbols.txt"; \
                cd /work; \
              }; \
              build_one .build/worktrees/baseline direct-slot-fs-baseline; \
              build_one . image-fs-cluster-batch; \
              build_one .build/worktrees/probe image-fs-cluster-batch-probe; \
              strings /work/artifacts/p0-image-fs-cluster-batch/image-fs-cluster-batch-probe.ELF | grep -q IMAGE-FS-CLUSTER; \
              if strings /work/artifacts/p0-image-fs-cluster-batch/image-fs-cluster-batch.ELF | grep -q IMAGE-FS-CLUSTER; then \
                echo "ERROR: timing candidate contains probe logging"; exit 1; \
              fi'

      - name: Write hardware A-B protocol
        shell: bash
        run: |
          set -euo pipefail
          cat > artifacts/p0-image-fs-cluster-batch/README.txt <<'EOF'
          P0 image-filesystem two-page cluster batching experiment

          POTWIERDZONE FROM CURRENT SOURCE:
            OpenImage accepts pages_per_cluster 1 or 2. Baseline ReadCluster calls
            ReadLogicalPage once per page; each logical page performs fileXioLseek
            followed by a 512-byte ReadExact.

          HYPOTHESIS:
            for two-page clusters, command/RPC overhead costs more than transporting
            the extra 32 spare/ECC bytes in PCSX2 .ps2 records.

          Baseline (two-page cluster):
            2 x fileXioLseek + 2 x logical 512-byte reads.

          Candidate VMC (stride 512):
            1 x fileXioLseek + 1 x 1024-byte read directly into the cluster buffer.

          Candidate PCSX2 .ps2 (stride 528):
            1 x fileXioLseek + 1 x 1056-byte read into aligned BSS scratch, then
            copy the two 512-byte data regions while discarding both 16-byte spare
            regions. Transport grows by only 32 bytes per two-page cluster.

          One-page clusters retain the original ReadLogicalPage path. The timing ELF
          contains no probe logging. The probe ELF logs IMAGE-FS-CLUSTER with batched,
          legacy and physical-byte counters and must not be used for primary timing.

          Correctness gate for full image scan:
            identical result, save count/order, names, display titles, byte counts,
            cluster counts, timestamps/attributes and no source-image modification.

          Correctness gate for selective restore:
            identical selected/restored counts, files/directories/bytes, rollback
            behavior and destination byte verification.

          Hardware A/B:
            same SCPH/revision, PS2SDK/IRX set, USB device/filesystem and exact source
            image. Test VMC and PCSX2 formats separately. Use a source whose superblock
            reports pages_per_cluster=2; probe batched count must be >0. Run repeated
            full image scans and selective restores. Derive operation time from Drebin
            trace timestamps and report p50/p95/p99/max plus failures. A promotion needs
            lower whole-operation latency without correctness regressions.

          PCSX2 is suitable for correctness inspection only. Real PS2 decides timing.
          EOF
          {
            echo "baseline=$DIRECT_SLOT_BASE_SHA"
            echo "candidate=$GITHUB_SHA"
            echo "ps2sdk=$PS2SDK_SECURITY_COMMIT"
          } > artifacts/p0-image-fs-cluster-batch/REVISIONS.txt
          sha256sum artifacts/p0-image-fs-cluster-batch/*.ELF > artifacts/p0-image-fs-cluster-batch/SHA256SUMS.txt
          cat artifacts/p0-image-fs-cluster-batch/*.size.txt

      - name: Upload cluster-batch experiment
        uses: actions/upload-artifact@v4
        with:
          name: PS2-MCI-P0-image-fs-cluster-batch-${{ github.sha }}
          path: artifacts/p0-image-fs-cluster-batch/
          if-no-files-found: error
          retention-days: 30
