name: One-shot prune Actions artifacts

on:
  push:
    branches:
      - feat/p0-fmcb-cross-region
    paths:
      - '.github/workflows/prune-artifacts-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete every Actions artifact except the newest one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          tmp="$(mktemp)"
          gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.created_at, (.id|tostring), .name, (.size_in_bytes|tostring)] | @tsv' \
            | sort -r > "$tmp"

          count="$(wc -l < "$tmp" | tr -d ' ')"
          if [ "$count" -eq 0 ]; then
            echo "No artifacts found."
            exit 0
          fi

          keep_line="$(head -n1 "$tmp")"
          keep_id="$(printf '%s\n' "$keep_line" | cut -f2)"
          keep_name="$(printf '%s\n' "$keep_line" | cut -f3)"
          keep_size="$(printf '%s\n' "$keep_line" | cut -f4)"

          total_before="$(awk -F '\t' '{s += $4} END {printf "%.0f", s}' "$tmp")"
          deleted_count=0
          deleted_bytes=0

          echo "Keeping newest artifact:"
          echo "  id=$keep_id"
          echo "  name=$keep_name"
          echo "  bytes=$keep_size"

          while IFS=$'\t' read -r created id name size; do
            [ "$id" = "$keep_id" ] && continue
            gh api --method DELETE "repos/$GH_REPO/actions/artifacts/$id"
            deleted_count=$((deleted_count + 1))
            deleted_bytes=$((deleted_bytes + size))
          done < "$tmp"

          echo "Artifacts before: $count"
          echo "Bytes before: $total_before"
          echo "Deleted artifacts: $deleted_count"
          echo "Deleted bytes: $deleted_bytes"
          echo "Remaining artifacts: 1"
          echo "Remaining bytes: $keep_size"
