name: Apply settings verification and marquee patch

on:
  push:
    branches:
      - feat/0.4.0
    paths:
      - 'tools/APPLY_SETTINGS_MARQUEE'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/0.4.0
          fetch-depth: 0

      - name: Patch settings, installer verification modes and marquee text
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if s.count(old) != 1:
                  raise SystemExit(f'{path}: anchor count={s.count(old)} for {old[:80]!r}')
              p.write_text(s.replace(old, new, 1))

          # settings.h: make read-back policy a real three-state setting.
          replace_once('src/settings.h',
