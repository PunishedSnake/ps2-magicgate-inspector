name: Apply marquee endpoint behavior

on:
  push:
    branches:
      - feat/0.4.0
    paths:
      - 'tools/APPLY_MARQUEE_ENDPOINT'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/0.4.0
          fetch-depth: 0

      - name: Apply bounded readable marquee
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/gui.c')
          s = p.read_text()

          old = '''/* Accessibility-first marquee: one whole glyph every 480 ms. The selected
 * setting pauses at the beginning before it starts moving. */
#define MARQUEE_STEP_MS 480u
#define MARQUEE_GAP_CHARS 4u
#define MARQUEE_HOLD_STEPS 6u
'''
          new = '''/* Accessibility-first marquee. Only the selected setting can animate.
 * Scroll a whole glyph every 240 ms, hold the readable beginning briefly,
 * stop for two seconds once the end is fully visible, then snap directly back
 * to the beginning instead of sending the text through a carousel gap. */
#define MARQUEE_STEP_MS 240u
#define MARQUEE_START_HOLD_MS 1500u
#define MARQUEE_END_HOLD_MS 2000u
'''
          if s.count(old) != 1:
              raise SystemExit('marquee constants anchor mismatch')
          s = s.replace(old, new, 1)

          old = '''static qword_t *text_marquee_box(qword_t *q, float x, float y,
                                 float max_x, const char *value, UiRgb rgb)
{
    size_t length = strcspn(value, "\\r\\n");
    unsigned int cells = max_x > x ? (unsigned int)((max_x - x) / GLYPH_W) : 0u;
    unsigned int ring;
    unsigned int step;
    unsigned int phase;
    unsigned int offset;
    unsigned int i;
    color_t color;

    if (cells == 0u || length == 0u)
        return q;
    color_set(&color, rgb);
    MarqueeNeeded = 1;
    ring = (unsigned int)length + MARQUEE_GAP_CHARS;
    step = (unsigned int)((GetTimerSystemTime() - MarqueeEpoch) /
                          MSec2TimerBusClock(MARQUEE_STEP_MS));
    phase = step % (MARQUEE_HOLD_STEPS + ring);
    offset = phase < MARQUEE_HOLD_STEPS ? 0u : phase - MARQUEE_HOLD_STEPS;

    for (i = 0; i < cells; i++) {
        unsigned int pos = (offset + i) % ring;
        unsigned char ch = pos < length ? (unsigned char)value[pos] : ' ';
        q = glyph(q, x + (float)(i * GLYPH_W), y, ch, &color);
    }
    return q;
}
'''
          new = '''static qword_t *text_marquee_box(qword_t *q, float x, float y,
                                 float max_x, const char *value, UiRgb rgb)
{
    size_t length = strcspn(value, "\\r\\n");
    unsigned int cells = max_x > x ? (unsigned int)((max_x - x) / GLYPH_W) : 0u;
    unsigned int max_offset;
    unsigned int offset;
    unsigned int i;
    u64 elapsed;
    u64 step_ticks;
    u64 start_hold_ticks;
    u64 end_hold_ticks;
    u64 scroll_ticks;
    u64 cycle_ticks;
    u64 phase;
    color_t color;

    if (cells == 0u || length == 0u)
        return q;
    if (length <= cells)
        return q;

    color_set(&color, rgb);
    MarqueeNeeded = 1;
    max_offset = (unsigned int)length - cells;
    elapsed = GetTimerSystemTime() - MarqueeEpoch;
    step_ticks = MSec2TimerBusClock(MARQUEE_STEP_MS);
    start_hold_ticks = MSec2TimerBusClock(MARQUEE_START_HOLD_MS);
    end_hold_ticks = MSec2TimerBusClock(MARQUEE_END_HOLD_MS);
    scroll_ticks = (u64)max_offset * step_ticks;
    cycle_ticks = start_hold_ticks + scroll_ticks + end_hold_ticks;
    phase = cycle_ticks != 0u ? elapsed % cycle_ticks : 0u;

    if (phase < start_hold_ticks) {
        offset = 0u;
    } else if (phase < start_hold_ticks + scroll_ticks) {
        offset = (unsigned int)((phase - start_hold_ticks) / step_ticks);
        if (offset > max_offset)
            offset = max_offset;
    } else {
        /* Keep the final part of the sentence fully readable for two seconds. */
        offset = max_offset;
    }

    for (i = 0; i < cells; i++) {
        unsigned int pos = offset + i;
        unsigned char ch = pos < length ? (unsigned char)value[pos] : ' ';
        q = glyph(q, x + (float)(i * GLYPH_W), y, ch, &color);
    }
    return q;
}
'''
          if s.count(old) != 1:
              raise SystemExit('marquee function anchor mismatch')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          git diff --check
          git diff --stat

      - name: Commit code patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/gui.c
          git commit -m 'fix(ui): use bounded marquee with endpoint pause'
          git push origin HEAD:feat/0.4.0
