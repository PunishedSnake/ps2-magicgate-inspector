name: Apply FMCB preflight bounds

on:
  push:
    branches:
      - feat/0.4.0
    paths:
      - 'tools/APPLY_FMCB_UI_BOUNDS'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/0.4.0
          fetch-depth: 0

      - name: Patch FMCB preflight text bounds
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/gui.c')
          s = p.read_text()

          old = '''static int LastSettingsMarqueeRow = -1;
static unsigned int LastSettingsMarqueeState = ~0u;
'''
          new = '''static int LastSettingsMarqueeRow = -1;
static unsigned int LastSettingsMarqueeState = ~0u;
static int LastFmcbMarqueeSlot = -1;
static int LastFmcbMarqueeStatus = -1;
'''
          if s.count(old) != 1:
              raise SystemExit('global marquee state anchor mismatch')
          s = s.replace(old, new, 1)

          old = '''    int shown = 0;
    int i;

    q = slot_summary(q, selected, cards, magicgate, packages);
'''
          new = '''    int shown = 0;
    int i;

    /* The install-plan action is the only passive marquee on this page. Reset
     * it when the selected card or preflight state changes so users always see
     * the beginning before the bounded scroll starts. */
    if (selected != LastFmcbMarqueeSlot ||
        (int)r->status != LastFmcbMarqueeStatus) {
        MarqueeEpoch = GetTimerSystemTime();
        LastFmcbMarqueeSlot = selected;
        LastFmcbMarqueeStatus = (int)r->status;
    }

    q = slot_summary(q, selected, cards, magicgate, packages);
'''
          if s.count(old) != 1:
              raise SystemExit('render_fmcb entry anchor mismatch')
          s = s.replace(old, new, 1)

          old = '''    snprintf(line, sizeof(line), "Required %d/%d  missing %d",
             r->found_required, r->plan.required_files, r->missing_required);
    q = text(q, 172, 164, line,
             r->missing_required == 0 && r->status == FMCB_PACKAGE_READY ? Theme.success : Theme.text);
    snprintf(line, sizeof(line), "Optional %d/%d   KELF %d",
             r->found_optional, r->plan.optional_files, r->plan.kelf_files);
    q = text(q, 172, 176, line, Theme.text);
    q = text(q, 172, 190,
             r->status == FMCB_PACKAGE_READY ? "SQUARE  Open verified installer" : "Run preflight before installation",
             r->status == FMCB_PACKAGE_READY ? Theme.accent : Theme.warning);
'''
          new = '''    snprintf(line, sizeof(line), "Required %d/%d  missing %d",
             r->found_required, r->plan.required_files, r->missing_required);
    q = text_box(q, 172, 164, 408, 172, line,
                 r->missing_required == 0 && r->status == FMCB_PACKAGE_READY ? Theme.success : Theme.text);
    snprintf(line, sizeof(line), "Optional %d/%d   KELF %d",
             r->found_optional, r->plan.optional_files, r->plan.kelf_files);
    q = text_box(q, 172, 176, 408, 184, line, Theme.text);
    q = selected_single_line(q, 172, 190, 408, 198,
             r->status == FMCB_PACKAGE_READY ? "SQUARE  Open verified installer" : "Run preflight before installation",
             r->status == FMCB_PACKAGE_READY ? Theme.accent : Theme.warning);
'''
          if s.count(old) != 1:
              raise SystemExit('install plan lines anchor mismatch')
          s = s.replace(old, new, 1)

          old = '''    if (page != MCI_GUI_SETTINGS) {
        LastSettingsMarqueeRow = -1;
        LastSettingsMarqueeState = ~0u;
    }

    q = frame_begin(&packet);
'''
          new = '''    if (page != MCI_GUI_SETTINGS) {
        LastSettingsMarqueeRow = -1;
        LastSettingsMarqueeState = ~0u;
    }
    if (page != MCI_GUI_FMCB) {
        LastFmcbMarqueeSlot = -1;
        LastFmcbMarqueeStatus = -1;
    }

    q = frame_begin(&packet);
'''
          if s.count(old) != 1:
              raise SystemExit('dashboard marquee reset anchor mismatch')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          git diff --check
          git diff -- src/gui.c

      - name: Commit source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/gui.c
          git commit -m 'fix(ui): bound and scroll FMCB preflight action text'
          git push origin HEAD:feat/0.4.0
