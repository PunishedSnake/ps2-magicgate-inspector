name: P0 USB Write Pipeline A-B

on:
  workflow_dispatch:
  push:
    branches:
      - feat/0.4.0-dev4-save-transfer-picker-impl4
    paths:
      - 'src/image_write_behind.c'
      - 'src/image_write_behind.h'
      - 'src/card_image.c'
      - 'Makefile'
      - '.github/workflows/p0-usb-write-pipeline-ab.yml'

permissions:
  contents: read

env:
  PS2SDK_SECURITY_COMMIT: a13b5971ec0e39c7ba8b8559b80a4e81c8425352

jobs:
  build-ab-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage pinned PS2SDK personalities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/ps2sdk2-mg .build/ps2sdk2-secr14 .build/ps2sdk2-raw
          docker pull ps2dev/ps2dev:v2.0.0
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e PS2SDK_SECURITY_COMMIT="$PS2SDK_SECURITY_COMMIT" \
            ps2dev/ps2dev:v2.0.0 \
            sh -c 'set -eu; \
              apk add --no-cache git python3 build-base >/dev/null; \
              for f in freesio2.irx freepad.irx mcman.irx mcserv.irx; do cp "/usr/local/ps2dev/ps2sdk/iop/irx/$f" "/work/.build/ps2sdk2-mg/$f"; done; \
              git init -q /tmp/ps2sdk-src; \
              git -C /tmp/ps2sdk-src remote add origin https://github.com/ps2dev/ps2sdk.git; \
              git -C /tmp/ps2sdk-src fetch -q --depth 1 origin "$PS2SDK_SECURITY_COMMIT"; \
              git -C /tmp/ps2sdk-src checkout -q FETCH_HEAD; \
              python3 /work/tools/patch_secrman14_diag.py /tmp/ps2sdk-src/iop/security/secrman; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/security/secrman clean all; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/security/secrsif clean all; \
              cp /tmp/ps2sdk-src/iop/security/secrman/irx/secrman.irx /work/.build/ps2sdk2-secr14/secrman.irx; \
              cp /tmp/ps2sdk-src/iop/security/secrsif/irx/secrsif.irx /work/.build/ps2sdk2-secr14/secrsif.irx; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/memorycard/mcman clean; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/memorycard/mcman all MCMAN_BUILDING_XMCMAN=0 MCMAN_BUILDING_XMCMAN_V2=0; \
              python3 /work/tools/patch_raw_mcserv_ports.py /tmp/ps2sdk-src/iop/memorycard/mcserv/src/mcserv.c; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/memorycard/mcserv clean; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/memorycard/mcserv all MCMAN_BUILDING_XMCSERV=0; \
              cp /tmp/ps2sdk-src/iop/memorycard/mcman/irx/mcman.irx /work/.build/ps2sdk2-raw/mcman.irx; \
              cp /tmp/ps2sdk-src/iop/memorycard/mcserv/irx/mcserv.irx /work/.build/ps2sdk2-raw/mcserv.irx'

      - name: Build controlled USB write matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/p0-usb-write-ab
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            ps2dev/ps2dev:v2.0.0 \
            sh -c 'set -eu; \
              apk add --no-cache build-base >/dev/null; \
              build_variant() { \
                name="$1"; pages="$2"; async="$3"; \
                rm -f src/image_write_behind.o MC_INSPECTOR.ELF; \
                make R5900_BENCH=0 RAW_BULK_PAGES=16 RAW_BULK_ASYNC=0 IMAGE_WRITE_PAGES="$pages" IMAGE_WRITE_ASYNC="$async" MC_INSPECTOR.ELF; \
                cp MC_INSPECTOR.ELF "/work/artifacts/p0-usb-write-ab/$name.ELF"; \
              }; \
              build_variant MC_INSPECTOR-usb-sync32 32 0; \
              build_variant MC_INSPECTOR-usb-sync64 64 0; \
              build_variant MC_INSPECTOR-usb-sync128 128 0; \
              build_variant MC_INSPECTOR-usb-async32 32 1; \
              build_variant MC_INSPECTOR-usb-async64 64 1'

      - name: Write hardware A-B protocol
        shell: bash
        run: |
          cat > artifacts/p0-usb-write-ab/README-P0-USB-WRITE-AB.txt <<'EOF'
          P0 USB image write pipeline hardware A/B matrix

          Common source revision: this workflow's GITHUB_SHA.
          Raw-card side is fixed to synchronous 16-page bulk reads in every variant.
          Synthetic R5900 benchmark is disabled in every variant.
          Pinned PS2SDK source: a13b5971ec0e39c7ba8b8559b80a4e81c8425352.

          A  MC_INSPECTOR-usb-sync32.ELF    32 image records, blocking fileXioWrite
          B  MC_INSPECTOR-usb-sync64.ELF    64 image records, blocking fileXioWrite
          C  MC_INSPECTOR-usb-sync128.ELF  128 image records, blocking fileXioWrite
          D  MC_INSPECTOR-usb-async32.ELF   32 image records, one outstanding NOWAIT write
          E  MC_INSPECTOR-usb-async64.ELF   64 image records, one outstanding NOWAIT write

          A vs B vs C isolates application batch size / command amortization.
          A vs D isolates one-deep overlap at 32 records.
          B vs E isolates one-deep overlap at 64 records.

          Keep console, card, slot, USB device, filesystem, image format and workload identical.
          Correctness gate: logical CRC, complete image verification and resulting file size must match.
          Record IMAGE-IO, RAW-BULK-PERF and IMAGE end lines from DREBIN.LOG.
          IMAGE-IO reports underlying calls/bytes, p50/p95/p99/max batch latency,
          async submits, ready hits, waits and wait ticks.
          A useful async candidate should reduce operation time or blocking wait without worsening
          verification, tail latency or reliability. Do not promote from PCSX2 timing alone.
          EOF
          printf 'Project revision: %s\n' "$GITHUB_SHA" > artifacts/p0-usb-write-ab/REVISION.txt
          sha256sum artifacts/p0-usb-write-ab/*.ELF | tee artifacts/p0-usb-write-ab/SHA256SUMS.txt
          file artifacts/p0-usb-write-ab/*.ELF
          ls -lh artifacts/p0-usb-write-ab/*.ELF

      - name: Upload P0 USB write matrix
        uses: actions/upload-artifact@v4
        with:
          name: PS2-MCI-P0-usb-write-AB-${{ github.sha }}
          path: artifacts/p0-usb-write-ab/
          if-no-files-found: error
          retention-days: 30
