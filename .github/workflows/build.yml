name: Apply 0.4 settings and marquee patch

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/apply_settings_marquee.py'
      - '.github/workflows/build.yml'
      - 'tools/APPLY_SETTINGS_MARQUEE'
      - '.github/workflows/one-shot-settings-marquee.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/0.4.0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/0.4.0
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_settings_marquee.py
          git diff --check
          git diff --stat

      - name: Commit patch and restore normal CI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git show HEAD^:.github/workflows/build.yml > .github/workflows/build.yml
          git rm -f tools/apply_settings_marquee.py tools/APPLY_SETTINGS_MARQUEE .github/workflows/one-shot-settings-marquee.yml
          git add src/settings.h src/settings.c src/fmcb_transaction.h src/fmcb_transaction.c src/gui.h src/gui.c src/app_main.c .github/workflows/build.yml
          git commit -m 'feat(ui): add verify policies and marquee overflow text'
          git push origin HEAD:feat/0.4.0
