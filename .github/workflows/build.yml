name: Build PS2 Memory Card Inspector

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - feat/0.4.0
    paths:
      - 'src/**'
      - 'tools/**'
      - 'docs/**'
      - 'Makefile'
      - '.github/workflows/build.yml'
      - 'LICENSE'
      - 'CREDITS.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'licenses/**'
  push:
    branches:
      - main
      - feat/0.4.0
      - feat/0.4.0-dev3-drebin
      - feat/0.4.0-dev4-drebin-browser
      - feat/0.4.0-dev4-save-transfer-picker-impl4
    paths:
      - 'src/**'
      - 'tools/**'
      - 'docs/**'
      - 'Makefile'
      - '.github/workflows/build.yml'
      - 'LICENSE'
      - 'CREDITS.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'licenses/**'

permissions:
  contents: read

env:
  PS2SDK_SECURITY_COMMIT: a13b5971ec0e39c7ba8b8559b80a4e81c8425352

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify host Docker
        shell: bash
        run: docker --version

      - name: Verify card-math optimization equivalence
        shell: bash
        run: python3 tools/verify_card_math.py

      - name: Stage PS2SDK 2.0 security and card personalities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/ps2sdk2-mg .build/ps2sdk2-secr14 .build/ps2sdk2-raw
          docker pull ps2dev/ps2dev:v2.0.0
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e PS2SDK_SECURITY_COMMIT="$PS2SDK_SECURITY_COMMIT" \
            ps2dev/ps2dev:v2.0.0 \
            sh -c 'set -eu; \
              apk add --no-cache git python3 build-base >/dev/null; \
              for f in freesio2.irx freepad.irx mcman.irx mcserv.irx; do cp "/usr/local/ps2dev/ps2sdk/iop/irx/$f" "/work/.build/ps2sdk2-mg/$f"; done; \
              git init -q /tmp/ps2sdk-src; \
              git -C /tmp/ps2sdk-src remote add origin https://github.com/ps2dev/ps2sdk.git; \
              git -C /tmp/ps2sdk-src fetch -q --depth 1 origin "$PS2SDK_SECURITY_COMMIT"; \
              git -C /tmp/ps2sdk-src checkout -q FETCH_HEAD; \
              python3 /work/tools/patch_secrman14_diag.py /tmp/ps2sdk-src/iop/security/secrman; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/security/secrman clean all; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/security/secrsif clean all; \
              cp /tmp/ps2sdk-src/iop/security/secrman/irx/secrman.irx /work/.build/ps2sdk2-secr14/secrman.irx; \
              cp /tmp/ps2sdk-src/iop/security/secrsif/irx/secrsif.irx /work/.build/ps2sdk2-secr14/secrsif.irx; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/memorycard/mcman clean; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/memorycard/mcman all MCMAN_BUILDING_XMCMAN=0 MCMAN_BUILDING_XMCMAN_V2=0; \
              python3 /work/tools/patch_raw_mcserv_ports.py /tmp/ps2sdk-src/iop/memorycard/mcserv/src/mcserv.c; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/memorycard/mcserv clean; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/memorycard/mcserv all MCMAN_BUILDING_XMCSERV=0; \
              cp /tmp/ps2sdk-src/iop/memorycard/mcman/irx/mcman.irx /work/.build/ps2sdk2-raw/mcman.irx; \
              cp /tmp/ps2sdk-src/iop/memorycard/mcserv/irx/mcserv.irx /work/.build/ps2sdk2-raw/mcserv.irx'
          echo 'Normal MagicGate/X-style modules:'
          sha256sum .build/ps2sdk2-mg/*.irx
          echo 'Security modules:'
          sha256sum .build/ps2sdk2-secr14/*.irx
          echo 'Legacy raw-page modules:'
          sha256sum .build/ps2sdk2-raw/*.irx

      - name: Build standalone ELF in PS2DEV v2.0.0
        shell: bash
        run: |
          set -euo pipefail
          docker pull ps2dev/ps2dev:v2.0.0
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            ps2dev/ps2dev:v2.0.0 \
            sh -c 'set -eu; \
              apk add --no-cache build-base >/dev/null; \
              mips64r5900el-ps2-elf-gcc --version; \
              echo "R5900 target options:"; \
              mips64r5900el-ps2-elf-gcc -Q --help=target -c -x c /dev/null -o /tmp/r5900-target-probe.o 2>/dev/null | grep -E "march=|mtune=|mfix-r5900" || true; \
              make'

      - name: Analyze R5900 hot path and compiler variants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            ps2dev/ps2dev:v2.0.0 \
            sh tools/r5900_static_report.sh artifacts/R5900_STATIC_REPORT.txt
          echo 'R5900 report summary:'
          grep -E '^(Compiler:|Target:|Final ELF|card_math compiler|[[:space:]]*text)' artifacts/R5900_STATIC_REPORT.txt || true

      - name: Build card-math O3 hardware A-B candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/r5900-ab artifacts
          cp MC_INSPECTOR.ELF .build/r5900-ab/MC_INSPECTOR-O2.ELF
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            ps2dev/ps2dev:v2.0.0 \
            sh -c 'set -eu; \
              mips64r5900el-ps2-elf-gcc \
                -D_EE -G0 -O2 -Wall -gdwarf-2 -gz \
                -O3 -G0 -Wall -Wextra -std=gnu99 \
                -fdata-sections -ffunction-sections \
                -DMG_SECR_PROFILE_PS2SDK14=1 -mtune=r5900 \
                -I/usr/local/ps2dev/ps2sdk/ee/include \
                -I/usr/local/ps2dev/ps2sdk/common/include -I. \
                -c src/card_math.c -o src/card_math.o; \
              make MC_INSPECTOR.ELF'
          cp MC_INSPECTOR.ELF artifacts/MC_INSPECTOR-cardmath-O3.ELF
          cp .build/r5900-ab/MC_INSPECTOR-O2.ELF MC_INSPECTOR.ELF
          {
            echo 'R5900 hardware A/B candidate'
            echo 'Baseline: MC_INSPECTOR.ELF = normal production O2 policy.'
            echo 'Candidate: MC_INSPECTOR-cardmath-O3.ELF = identical sources/link except card_math.c compiled with -O3 -mtune=r5900.'
            echo 'Compare the R5900-PERF line in DREBIN.LOG and require identical benchmark result hash plus normal image verification.'
          } > artifacts/R5900_AB_README.txt

      - name: Assemble development artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/licenses
          cp MC_INSPECTOR.ELF artifacts/MC_INSPECTOR.ELF
          cp LICENSE artifacts/LICENSE
          cp CREDITS.md artifacts/CREDITS.md
          cp THIRD_PARTY_NOTICES.md artifacts/THIRD_PARTY_NOTICES.md
          cp README.md artifacts/README.md
          cp licenses/PS2SDK-AFL-2.0.txt artifacts/licenses/PS2SDK-AFL-2.0.txt
          {
            echo "PS2 Memory Card Inspector 0.4.0-dev4 - Drebin"
            echo "Project revision: $GITHUB_SHA"
            echo "Frontend: configurable Native / 480p / 576p / 720p / 1080i GS dashboard"
            echo "Card Tools: PCSX2 .ps2 and OPL .vmc imaging plus filesystem-aware browser/selective restore"
            echo "Raw page backend: dedicated legacy PS2SDK MCMAN/MCSERV built with XMC compatibility disabled"
            echo "Raw port contract: MCSERV preserves logical mc0/mc1 ports 0/1; MCMAN owns the final physical SIO2 channel 2/3 mapping"
            echo "Raw acquisition: private 16-page/8192-byte MCSERV bulk-read RPC with legacy mcReadPage fallback and telemetry"
            echo "EE stream copy: native R5900 LQ/SQ qword path for aligned image buffers with memcpy fallback"
            echo "EE profiling: bounded R5900 PCCR/PCR hardware-counter benchmark for copy, CRC32 and ECC hot kernels"
            echo "Compiler audit: R5900_STATIC_REPORT.txt records target flags, optimizer switches, sizes and hot-path disassembly"
            echo "A/B candidate: MC_INSPECTOR-cardmath-O3.ELF changes only card_math.c from the production O2 policy to -O3 -mtune=r5900"
            echo "Normal card restore fix: XMC mcInit re-primes card detection after temporary IOP personalities"
            echo "Selective restore: source geometry is never copied; saves are streamed through PS2 filesystem/FAT parsing into the destination card"
            echo "MagicGate: immutable raw FMCB.XLF cache in EE RAM with disposable per-bind clones"
            echo "Installer: protected-target inventory fallback, configurable read-back policy and persistent USB recovery journal"
            echo "Region policy: ROMVER + read-only MechaCon/MechaPwn profiling; unsafe Deckard CEX one-region installs are blocked"
            echo "PS2SDK source: https://github.com/ps2dev/ps2sdk/commit/$PS2SDK_SECURITY_COMMIT"
            echo "SECRMAN: PS2SDK 2.0 module version 1.4, instrumented by tools/patch_secrman14_diag.py"
            echo "Raw MCSERV: patched reproducibly by tools/patch_raw_mcserv_ports.py"
          } > artifacts/SOURCE_PROVENANCE.txt

      - name: Verify output
        shell: bash
        run: |
          set -euo pipefail
          file artifacts/MC_INSPECTOR.ELF artifacts/MC_INSPECTOR-cardmath-O3.ELF
          ls -lh artifacts/MC_INSPECTOR.ELF artifacts/MC_INSPECTOR-cardmath-O3.ELF artifacts/R5900_STATIC_REPORT.txt
          sha256sum artifacts/MC_INSPECTOR.ELF artifacts/MC_INSPECTOR-cardmath-O3.ELF | tee artifacts/SHA256SUMS.txt

      - name: Upload development build
        uses: actions/upload-artifact@v4
        with:
          name: PS2-Memory-Card-Inspector-0.4.0-dev4-Drebin-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
