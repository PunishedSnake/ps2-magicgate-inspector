name: Build PS2 Memory Card Inspector

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'iop/**'
      - 'mgtrace_protocol.h'
      - 'Makefile'
      - '.github/workflows/build.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'iop/**'
      - 'mgtrace_protocol.h'
      - 'Makefile'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify host Docker
        shell: bash
        run: docker --version

      - name: Stage FMCB-compatible PS2SDK v1 IOP modules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/fmcb-ps2sdk-v1
          docker pull ps2dev/ps2dev:v1.0
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            ps2dev/ps2dev:v1.0 \
            sh -c 'set -eu; for f in freesio2.irx freepad.irx mcman.irx mcserv.irx; do cp "/usr/local/ps2dev/ps2sdk/iop/irx/$f" "/work/.build/fmcb-ps2sdk-v1/$f"; done'
          ls -lh .build/fmcb-ps2sdk-v1
          sha256sum .build/fmcb-ps2sdk-v1/*.irx

      - name: Build tracer and standalone ELF in PS2DEV v2.0.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts .build/mgtrace
          docker pull ps2dev/ps2dev:v2.0.0
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            ps2dev/ps2dev:v2.0.0 \
            sh -c 'set -eu; apk add --no-cache build-base git >/dev/null; mips64r5900el-ps2-elf-gcc --version; git init -q /tmp/ps2sdk-src; git -C /tmp/ps2sdk-src remote add origin https://github.com/ps2dev/ps2sdk.git; git -C /tmp/ps2sdk-src fetch -q --depth 1 origin a13b5971ec0e39c7ba8b8559b80a4e81c8425352; git -C /tmp/ps2sdk-src checkout -q FETCH_HEAD; PS2SDKSRC=/tmp/ps2sdk-src make -C iop/mgtrace clean all; cp iop/mgtrace/irx/mgtrace.irx .build/mgtrace/mgtrace.irx; make'
          ls -lh .build/mgtrace/mgtrace.irx
          sha256sum .build/mgtrace/mgtrace.irx
          cp MC_INSPECTOR.ELF artifacts/MC_INSPECTOR.ELF

      - name: Verify output
        shell: bash
        run: |
          set -euo pipefail
          file artifacts/MC_INSPECTOR.ELF
          ls -lh artifacts/MC_INSPECTOR.ELF
          sha256sum artifacts/MC_INSPECTOR.ELF | tee artifacts/SHA256SUMS.txt

      - name: Upload standalone ELF
        uses: actions/upload-artifact@v4
        with:
          name: PS2-Memory-Card-Inspector-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
