name: Build PS2 Memory Card Inspector

on:
  workflow_dispatch:
    inputs:
      secr_profile:
        description: MagicGate security backend
        required: true
        default: fmcb13
        type: choice
        options:
          - fmcb13
          - ps2sdk14
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'Makefile'
      - '.github/workflows/build.yml'
  push:
    branches:
      - main
      - feat/0.2.0-briscoe
    paths:
      - 'src/**'
      - 'tools/**'
      - 'Makefile'
      - '.github/workflows/build.yml'

permissions:
  contents: read

# The Briscoe feature branch intentionally builds ps2sdk14 on push while the
# backend comparison is in progress. Manual runs can still select either stack.
env:
  SECR_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.secr_profile || 'ps2sdk14' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify host Docker
        shell: bash
        run: docker --version

      - name: Stage hardware-validated FMCB SECRMAN 1.3 profile
        if: env.SECR_PROFILE == 'fmcb13'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/fmcb-ps2sdk-v1 .build/fmcb-secr-1.3-diag
          docker pull ps2dev/ps2dev:v1.0
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            ps2dev/ps2dev:v1.0 \
            sh -c 'set -eu; apk add --no-cache git python3 build-base >/dev/null; for f in freesio2.irx freepad.irx mcman.irx mcserv.irx; do cp "/usr/local/ps2dev/ps2sdk/iop/irx/$f" "/work/.build/fmcb-ps2sdk-v1/$f"; done; git init -q /tmp/fmcb; git -C /tmp/fmcb remote add origin https://github.com/israpps/FreeMcBoot-Installer.git; git -C /tmp/fmcb fetch -q --depth 1 origin ac53a47a5c6eae675cc2611c7bebe62f56c7845c; git -C /tmp/fmcb checkout -q FETCH_HEAD; python3 /work/tools/patch_secrman13_diag.py /tmp/fmcb/installer/irx/source/secrman; make -C /tmp/fmcb/installer/irx/source/secrman clean all; cp /tmp/fmcb/installer/irx/source/secrman/irx/secrman.irx /work/.build/fmcb-secr-1.3-diag/secrman.irx'
          ls -lh .build/fmcb-ps2sdk-v1 .build/fmcb-secr-1.3-diag
          sha256sum .build/fmcb-ps2sdk-v1/*.irx .build/fmcb-secr-1.3-diag/secrman.irx

      - name: Stage experimental PS2SDK 2.0 SECRMAN 1.4 profile
        if: env.SECR_PROFILE == 'ps2sdk14'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/ps2sdk2-mg .build/ps2sdk2-secr14
          docker pull ps2dev/ps2dev:v2.0.0
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            ps2dev/ps2dev:v2.0.0 \
            sh -c 'set -eu; apk add --no-cache git python3 build-base >/dev/null; for f in freesio2.irx freepad.irx mcman.irx mcserv.irx; do cp "/usr/local/ps2dev/ps2sdk/iop/irx/$f" "/work/.build/ps2sdk2-mg/$f"; done; git init -q /tmp/ps2sdk-src; git -C /tmp/ps2sdk-src remote add origin https://github.com/ps2dev/ps2sdk.git; git -C /tmp/ps2sdk-src fetch -q --depth 1 origin a13b5971ec0e39c7ba8b8559b80a4e81c8425352; git -C /tmp/ps2sdk-src checkout -q FETCH_HEAD; python3 /work/tools/patch_secrman14_diag.py /tmp/ps2sdk-src/iop/security/secrman; PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/security/secrman clean all; PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/security/secrsif clean all; cp /tmp/ps2sdk-src/iop/security/secrman/irx/secrman.irx /work/.build/ps2sdk2-secr14/secrman.irx; cp /tmp/ps2sdk-src/iop/security/secrsif/irx/secrsif.irx /work/.build/ps2sdk2-secr14/secrsif.irx'
          ls -lh .build/ps2sdk2-mg .build/ps2sdk2-secr14
          sha256sum .build/ps2sdk2-mg/*.irx .build/ps2sdk2-secr14/*.irx

      - name: Build standalone ELF in PS2DEV v2.0.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          docker pull ps2dev/ps2dev:v2.0.0
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e SECR_PROFILE="$SECR_PROFILE" \
            ps2dev/ps2dev:v2.0.0 \
            sh -c 'set -eu; apk add --no-cache build-base >/dev/null; mips64r5900el-ps2-elf-gcc --version; make SECR_PROFILE="$SECR_PROFILE"'
          cp MC_INSPECTOR.ELF artifacts/MC_INSPECTOR.ELF
          printf '%s\n' "$SECR_PROFILE" > artifacts/SECR_PROFILE.txt
          cp LICENSE artifacts/LICENSE
          cp CREDITS.md artifacts/CREDITS.md
          cp THIRD_PARTY_NOTICES.md artifacts/THIRD_PARTY_NOTICES.md
          cp README.md artifacts/README.md

      - name: Verify output
        shell: bash
        run: |
          set -euo pipefail
          file artifacts/MC_INSPECTOR.ELF
          ls -lh artifacts/MC_INSPECTOR.ELF
          sha256sum artifacts/MC_INSPECTOR.ELF | tee artifacts/SHA256SUMS.txt

      - name: Upload development artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS2-Memory-Card-Inspector-${{ env.SECR_PROFILE }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
