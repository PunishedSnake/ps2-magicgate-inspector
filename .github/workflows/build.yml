name: Apply staged 0.4 source patch

on:
  pull_request:
    branches: [ feat/0.4.0 ]
    paths:
      - 'tools/APPLY_USER_COPY_RECURSIVE'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'tmp/user-copy-recursive'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 0.4 branch
        uses: actions/checkout@v4
        with:
          ref: feat/0.4.0
          fetch-depth: 0
      - name: Apply staged patch
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/APPLY_USER_COPY_RECURSIVE
          python3 tools/apply_user_copy_recursive.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/gui_core.inc src/gui.c src/card.c src/magicgate.c src/fmcb_install.c
          git rm tools/APPLY_USER_COPY_RECURSIVE tools/apply_user_copy_recursive.py
          git commit -m 'feat(ui): clarify diagnostics and recursively discover FMCB sources'
          git push origin HEAD:feat/0.4.0
