name: Build PS2 Memory Card Inspector

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'docs/**'
      - 'Makefile'
      - '.github/workflows/build.yml'
      - 'LICENSE'
      - 'CREDITS.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'licenses/**'
  push:
    branches:
      - main
      - feat/0.4.0
    paths:
      - 'src/**'
      - 'tools/**'
      - 'docs/**'
      - 'Makefile'
      - '.github/workflows/build.yml'
      - 'LICENSE'
      - 'CREDITS.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'licenses/**'

permissions:
  contents: write

env:
  PS2SDK_SECURITY_COMMIT: a13b5971ec0e39c7ba8b8559b80a4e81c8425352

jobs:
  patch-settings-marquee:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/0.4.0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/0.4.0
          fetch-depth: 0

      - name: Apply focused marquee accessibility patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gui = Path('src/gui.c')
          s = gui.read_text()
          if '#define MARQUEE_STEP_MS 120u' not in s:
              print('Patch already applied; nothing to do.')
              raise SystemExit(0)

          def one(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected one anchor, got {n}')
              return text.replace(old, new, 1)

          s = one(s,
          '''#define MARQUEE_STEP_MS 120u
#define MARQUEE_GAP_CHARS 4u
#define MARQUEE_HOLD_STEPS 6u
''',
          '''/* Accessibility-first marquee: one whole glyph every 480 ms. The
 * selected row pauses at the beginning before it starts moving. */
#define MARQUEE_STEP_MS 480u
#define MARQUEE_GAP_CHARS 4u
#define MARQUEE_HOLD_STEPS 6u
''', 'speed')

          s = one(s,
          '''static u64 MarqueeEpoch;
static int MarqueeNeeded;
''',
          '''static u64 MarqueeEpoch;
static int MarqueeNeeded;
static int LastSettingsMarqueeRow = -1;
''', 'row state')

          s = one(s,
          '''    color_set(&color, rgb);
    if (max_y - y <= GLYPH_H + 1.0f) {
        size_t length = strcspn(value, "\\r\\n");
        unsigned int cells = max_x > x ? (unsigned int)((max_x - x) / GLYPH_W) : 0u;
        if (length > cells)
            return text_marquee_box(q, x, y, max_x, value, rgb);
    }

    while (*p != '\\0' && cy + GLYPH_H <= max_y) {
''',
          '''    color_set(&color, rgb);

    while (*p != '\\0' && cy + GLYPH_H <= max_y) {
''', 'disable global marquee')

          s = one(s,
          '''static qword_t *text(qword_t *q, float x, float y,
                     const char *value, UiRgb rgb)
{
    return text_box(q, x, y, UI_W - 12.0f, UI_H - 3.0f, value, rgb);
}
''',
          '''static qword_t *selected_single_line(qword_t *q, float x, float y,
                                            float max_x, float max_y,
                                            const char *value, UiRgb rgb)
{
    size_t length;
    unsigned int cells;

    if (value == NULL)
        return q;
    length = strcspn(value, "\\r\\n");
    cells = max_x > x ? (unsigned int)((max_x - x) / GLYPH_W) : 0u;
    if (length > cells)
        return text_marquee_box(q, x, y, max_x, value, rgb);
    return text_box(q, x, y, max_x, max_y, value, rgb);
}

static qword_t *text(qword_t *q, float x, float y,
                     const char *value, UiRgb rgb)
{
    return text_box(q, x, y, UI_W - 12.0f, UI_H - 3.0f, value, rgb);
}
''', 'selected helper')

          s = one(s,
          '''    q = text_box(q, 38, y0 + 4, 310, y0 + 12, name, Theme.text);
    q = text_box(q, 322, y0 + 4, 604, y0 + 12, value, Theme.accent);
    q = text_box(q, 38, y0 + 15, 604, y0 + 23, hint, Theme.muted);
    return q;
}
''',
          '''    q = text_box(q, 38, y0 + 4, 310, y0 + 12, name, Theme.text);
    if (row == selected) {
        q = selected_single_line(q, 322, y0 + 4, 604, y0 + 12,
                                 value, Theme.accent);
        q = selected_single_line(q, 38, y0 + 15, 604, y0 + 23,
                                 hint, Theme.muted);
    } else {
        q = text_box(q, 322, y0 + 4, 604, y0 + 12, value, Theme.accent);
        q = text_box(q, 38, y0 + 15, 604, y0 + 23, hint, Theme.muted);
    }
    return q;
}
''', 'selected row')

          s = one(s,
          '''    q = panel_title(q, 12, 55, 628, 69, "SETTINGS", Theme.accent);
    snprintf(video, sizeof(video), "%s%s",
''',
          '''    if (selected_row != LastSettingsMarqueeRow) {
        MarqueeEpoch = GetTimerSystemTime();
        LastSettingsMarqueeRow = selected_row;
    }

    q = panel_title(q, 12, 55, 628, 69, "SETTINGS", Theme.accent);
    snprintf(video, sizeof(video), "%s%s",
''', 'selection reset')

          s = one(s,
          '''    if ((unsigned int)page >= MCI_GUI_PAGE_COUNT)
        page = MCI_GUI_CARD;

    q = frame_begin(&packet);
''',
          '''    if ((unsigned int)page >= MCI_GUI_PAGE_COUNT)
        page = MCI_GUI_CARD;
    if (page != MCI_GUI_SETTINGS)
        LastSettingsMarqueeRow = -1;

    q = frame_begin(&packet);
''', 'page reset')
          gui.write_text(s)

          vm = Path('src/video_mode.c')
          v = vm.read_text()
          replacements = {
              '"Native automatic (640x224 field)"': '"Native (640x224)"',
              '"480p progressive (720x448)"': '"480p (720x448)"',
              '"576p progressive (720x576)"': '"576p (720x576)"',
              '"720p progressive (1280x720)"': '"720p (1280x720)"',
              '"1080i interlaced (1920x1080)"': '"1080i (1920x1080)"',
          }
          for old, new in replacements.items():
              if v.count(old) != 1:
                  raise SystemExit(f'video label anchor mismatch: {old}')
              v = v.replace(old, new, 1)
          vm.write_text(v)
          PY
          git diff --check
          git diff --stat

      - name: Commit code-only patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/gui.c src/video_mode.c; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/gui.c src/video_mode.c
          git commit -m 'fix(ui): slow marquee and animate selected setting only'
          git push origin HEAD:feat/0.4.0

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify host Docker
        shell: bash
        run: docker --version

      - name: Stage PS2SDK 2.0 MagicGate stack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/ps2sdk2-mg .build/ps2sdk2-secr14
          docker pull ps2dev/ps2dev:v2.0.0
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e PS2SDK_SECURITY_COMMIT="$PS2SDK_SECURITY_COMMIT" \
            ps2dev/ps2dev:v2.0.0 \
            sh -c 'set -eu; apk add --no-cache git python3 build-base >/dev/null; for f in freesio2.irx freepad.irx mcman.irx mcserv.irx; do cp "/usr/local/ps2dev/ps2sdk/iop/irx/$f" "/work/.build/ps2sdk2-mg/$f"; done; git init -q /tmp/ps2sdk-src; git -C /tmp/ps2sdk-src remote add origin https://github.com/ps2dev/ps2sdk.git; git -C /tmp/ps2sdk-src fetch -q --depth 1 origin "$PS2SDK_SECURITY_COMMIT"; git -C /tmp/ps2sdk-src checkout -q FETCH_HEAD; python3 /work/tools/patch_secrman14_diag.py /tmp/ps2sdk-src/iop/security/secrman; PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/security/secrman clean all; PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/security/secrsif clean all; cp /tmp/ps2sdk-src/iop/security/secrman/irx/secrman.irx /work/.build/ps2sdk2-secr14/secrman.irx; cp /tmp/ps2sdk-src/iop/security/secrsif/irx/secrsif.irx /work/.build/ps2sdk2-secr14/secrsif.irx'
          sha256sum .build/ps2sdk2-mg/*.irx .build/ps2sdk2-secr14/*.irx

      - name: Build standalone ELF in PS2DEV v2.0.0
        shell: bash
        run: |
          set -euo pipefail
          docker pull ps2dev/ps2dev:v2.0.0
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            ps2dev/ps2dev:v2.0.0 \
            sh -c 'set -eu; apk add --no-cache build-base >/dev/null; mips64r5900el-ps2-elf-gcc --version; make'

      - name: Assemble development artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/licenses
          cp MC_INSPECTOR.ELF artifacts/MC_INSPECTOR.ELF
          cp LICENSE artifacts/LICENSE
          cp CREDITS.md artifacts/CREDITS.md
          cp THIRD_PARTY_NOTICES.md artifacts/THIRD_PARTY_NOTICES.md
          cp README.md artifacts/README.md
          cp licenses/PS2SDK-AFL-2.0.txt artifacts/licenses/PS2SDK-AFL-2.0.txt
          {
            echo "PS2 Memory Card Inspector 0.4.0 development"
            echo "Project revision: $GITHUB_SHA"
            echo "Frontend: configurable Native / 480p / 576p / 720p / 1080i GS dashboard"
            echo "Installer: configurable read-back policy, persistent USB recovery journal and card identity marker"
            echo "Region policy: ROMVER + read-only MechaCon/MechaPwn profiling; unsafe Deckard CEX one-region installs are blocked"
            echo "PS2SDK security source: https://github.com/ps2dev/ps2sdk/commit/$PS2SDK_SECURITY_COMMIT"
            echo "SECRMAN: PS2SDK 2.0 module version 1.4, instrumented by tools/patch_secrman14_diag.py"
          } > artifacts/SOURCE_PROVENANCE.txt

      - name: Verify output
        shell: bash
        run: |
          set -euo pipefail
          file artifacts/MC_INSPECTOR.ELF
          ls -lh artifacts/MC_INSPECTOR.ELF
          sha256sum artifacts/MC_INSPECTOR.ELF | tee artifacts/SHA256SUMS.txt

      - name: Upload development build
        uses: actions/upload-artifact@v4
        with:
          name: PS2-Memory-Card-Inspector-0.4.0-dev-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
