name: Build PS2 Memory Card Inspector 0.4.1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - release/0.4.1-drebin

permissions:
  contents: write

env:
  PS2SDK_SECURITY_COMMIT: a13b5971ec0e39c7ba8b8559b80a4e81c8425352

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify host Docker
        run: docker --version

      - name: Verify source invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_card_math.py
          python3 tools/verify_fmcb_cross_region.py
          python3 tools/verify_settings_config.py

      - name: Stage PS2SDK 2.0 security and card personalities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/ps2sdk2-mg .build/ps2sdk2-secr14 .build/ps2sdk2-raw
          docker pull ps2dev/ps2dev:v2.0.0
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e PS2SDK_SECURITY_COMMIT="$PS2SDK_SECURITY_COMMIT" \
            ps2dev/ps2dev:v2.0.0 \
            sh -c 'set -eu; \
              apk add --no-cache git python3 build-base >/dev/null; \
              for f in freesio2.irx freepad.irx mcman.irx mcserv.irx; do cp "/usr/local/ps2dev/ps2sdk/iop/irx/$f" "/work/.build/ps2sdk2-mg/$f"; done; \
              git init -q /tmp/ps2sdk-src; \
              git -C /tmp/ps2sdk-src remote add origin https://github.com/ps2dev/ps2sdk.git; \
              git -C /tmp/ps2sdk-src fetch -q --depth 1 origin "$PS2SDK_SECURITY_COMMIT"; \
              git -C /tmp/ps2sdk-src checkout -q FETCH_HEAD; \
              python3 /work/tools/patch_secrman14_diag.py /tmp/ps2sdk-src/iop/security/secrman; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/security/secrman clean all; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/security/secrsif clean all; \
              cp /tmp/ps2sdk-src/iop/security/secrman/irx/secrman.irx /work/.build/ps2sdk2-secr14/secrman.irx; \
              cp /tmp/ps2sdk-src/iop/security/secrsif/irx/secrsif.irx /work/.build/ps2sdk2-secr14/secrsif.irx; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/memorycard/mcman clean; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/memorycard/mcman all MCMAN_BUILDING_XMCMAN=0 MCMAN_BUILDING_XMCMAN_V2=0; \
              python3 /work/tools/patch_raw_mcserv_ports.py /tmp/ps2sdk-src/iop/memorycard/mcserv/src/mcserv.c; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/memorycard/mcserv clean; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/memorycard/mcserv all MCMAN_BUILDING_XMCSERV=0; \
              cp /tmp/ps2sdk-src/iop/memorycard/mcman/irx/mcman.irx /work/.build/ps2sdk2-raw/mcman.irx; \
              cp /tmp/ps2sdk-src/iop/memorycard/mcserv/irx/mcserv.irx /work/.build/ps2sdk2-raw/mcserv.irx'

      - name: Build production ELF
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            ps2dev/ps2dev:v2.0.0 \
            sh -c 'set -eu; apk add --no-cache build-base >/dev/null; make MC_INSPECTOR.ELF'

      - name: Verify production profile
        shell: bash
        run: |
          set -euo pipefail
          grep -q -- '-mtune=r5900' Makefile
          grep -q 'DMCI_RAW_BULK_ASYNC=0' Makefile
          grep -q 'DMCI_IMAGE_READ_AHEAD_ASYNC=0' Makefile
          grep -q 'DMCI_IMAGE_WRITE_ASYNC=0' Makefile
          ! grep -q 'src/r5900_bench.o' Makefile
          ! grep -q 'src/r5900_perf.o' Makefile

      - name: Assemble release artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp MC_INSPECTOR.ELF artifacts/MC_INSPECTOR-0.4.1-Drebin.ELF

      - name: Verify artifact
        shell: bash
        run: |
          set -euo pipefail
          file artifacts/MC_INSPECTOR-0.4.1-Drebin.ELF
          test ! -e artifacts/MC_INSPECTOR-perflab-O2.ELF
          test ! -e artifacts/MC_INSPECTOR-p0-raw-sync4.ELF

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: PS2-Memory-Card-Inspector-0.4.1-Drebin-${{ github.sha }}
          path: artifacts/MC_INSPECTOR-0.4.1-Drebin.ELF
          if-no-files-found: error
          retention-days: 3

      - name: Publish 0.4.1 Drebin
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="0.4.1-Drebin"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it untouched."
            exit 0
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "0.4.1 - Drebin" \
            --notes-file RELEASE_NOTES.md \
            artifacts/MC_INSPECTOR-0.4.1-Drebin.ELF
