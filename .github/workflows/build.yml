name: Build PS2 Memory Card Inspector

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'Makefile'
      - '.github/workflows/build.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'Makefile'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build standalone ELF in PS2DEV v1.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            ps2dev/ps2dev:v1.0 \
            sh -c 'apk add --no-cache build-base >/dev/null && ee-gcc --version && make clean && make'
          cp MC_INSPECTOR.ELF artifacts/MC_INSPECTOR.ELF

      - name: Verify output
        shell: bash
        run: |
          set -euo pipefail
          file artifacts/MC_INSPECTOR.ELF
          ls -lh artifacts/MC_INSPECTOR.ELF
          sha256sum artifacts/MC_INSPECTOR.ELF | tee artifacts/SHA256SUMS.txt

      - name: Upload standalone ELF
        uses: actions/upload-artifact@v4
        with:
          name: PS2-Memory-Card-Inspector-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
