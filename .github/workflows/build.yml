name: Build PS2 Memory Card Inspector

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - release/0.4.1-drebin
      - 'release/**'

permissions:
  contents: write

env:
  PS2SDK_SECURITY_COMMIT: a13b5971ec0e39c7ba8b8559b80a4e81c8425352

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify host Docker
        run: docker --version

      - name: Verify source invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_card_math.py
          python3 tools/verify_fmcb_cross_region.py
          python3 tools/verify_settings_config.py

      - name: Save fixtures reproduce (mymc++ oracle)
        shell: bash
        run: |
          set -euo pipefail
          if python3 -m pip install --quiet --break-system-packages mymcplusplus 2>/dev/null ||
             python3 -m pip install --quiet mymcplusplus; then
            python3 tools/gen_save_fixtures.py --check > /dev/null
          else
            echo "::warning::mymcplusplus unavailable; committed fixtures used as-is"
          fi

      - name: Host unit tests
        shell: bash
        run: |
          set -euo pipefail
          make -C tests
          make -C tests clean
          make -C tests SAN=1

      - name: Stage PS2SDK 2.0 security and card personalities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/ps2sdk2-mg .build/ps2sdk2-secr14 .build/ps2sdk2-raw
          docker pull ps2dev/ps2dev:v2.0.0
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e PS2SDK_SECURITY_COMMIT="$PS2SDK_SECURITY_COMMIT" \
            ps2dev/ps2dev:v2.0.0 \
            sh -c 'set -eu; \
              apk add --no-cache git python3 build-base >/dev/null; \
              for f in freesio2.irx freepad.irx mcman.irx mcserv.irx; do cp "/usr/local/ps2dev/ps2sdk/iop/irx/$f" "/work/.build/ps2sdk2-mg/$f"; done; \
              git init -q /tmp/ps2sdk-src; \
              git -C /tmp/ps2sdk-src remote add origin https://github.com/ps2dev/ps2sdk.git; \
              git -C /tmp/ps2sdk-src fetch -q --depth 1 origin "$PS2SDK_SECURITY_COMMIT"; \
              git -C /tmp/ps2sdk-src checkout -q FETCH_HEAD; \
              python3 /work/tools/patch_secrman14_diag.py /tmp/ps2sdk-src/iop/security/secrman; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/security/secrman clean all; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/security/secrsif clean all; \
              cp /tmp/ps2sdk-src/iop/security/secrman/irx/secrman.irx /work/.build/ps2sdk2-secr14/secrman.irx; \
              cp /tmp/ps2sdk-src/iop/security/secrsif/irx/secrsif.irx /work/.build/ps2sdk2-secr14/secrsif.irx; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/memorycard/mcman clean; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/memorycard/mcman all MCMAN_BUILDING_XMCMAN=0 MCMAN_BUILDING_XMCMAN_V2=0; \
              python3 /work/tools/patch_raw_mcserv_ports.py /tmp/ps2sdk-src/iop/memorycard/mcserv/src/mcserv.c; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/memorycard/mcserv clean; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/memorycard/mcserv all MCMAN_BUILDING_XMCSERV=0; \
              cp /tmp/ps2sdk-src/iop/memorycard/mcman/irx/mcman.irx /work/.build/ps2sdk2-raw/mcman.irx; \
              cp /tmp/ps2sdk-src/iop/memorycard/mcserv/irx/mcserv.irx /work/.build/ps2sdk2-raw/mcserv.irx'

      - name: Build production ELF
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            ps2dev/ps2dev:v2.0.0 \
            sh -c 'set -eu; apk add --no-cache build-base >/dev/null; make MC_INSPECTOR.ELF'

      - name: Verify production profile
        shell: bash
        run: |
          set -euo pipefail
          grep -q -- '-mtune=r5900' Makefile
          grep -q 'DMCI_RAW_BULK_ASYNC=0' Makefile
          grep -q 'DMCI_IMAGE_READ_AHEAD_ASYNC=0' Makefile
          grep -q 'DMCI_IMAGE_WRITE_ASYNC=0' Makefile
          ! grep -q 'src/r5900_bench.o' Makefile
          ! grep -q 'src/r5900_perf.o' Makefile

      - name: Assemble release artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d ' \n\r' < VERSION)"
          echo "MCI_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "MCI_ASSET=MC_INSPECTOR-$VERSION-Drebin.ELF" >> "$GITHUB_ENV"
          mkdir -p artifacts
          cp MC_INSPECTOR.ELF "artifacts/MC_INSPECTOR-$VERSION-Drebin.ELF"
          cp THIRD_PARTY_NOTICES.md artifacts/
          mkdir -p artifacts/licenses && cp licenses/* artifacts/licenses/
          (cd artifacts && zip -qr "../MC_INSPECTOR-$VERSION-Drebin.zip" .)
          mv "MC_INSPECTOR-$VERSION-Drebin.zip" artifacts/

      - name: Verify artifact
        shell: bash
        run: |
          set -euo pipefail
          file "artifacts/$MCI_ASSET"
          test ! -e artifacts/MC_INSPECTOR-perflab-O2.ELF
          test ! -e artifacts/MC_INSPECTOR-p0-raw-sync4.ELF
          # The version the user sees must be the version being published.
          grep -q "v$MCI_VERSION  mc%d" src/gui_core.inc
          grep -q "Inspector  v$MCI_VERSION Drebin" src/gui_core.inc
          grep -q "Inspector $MCI_VERSION Drebin" src/app_main_v2.c
          grep -q "^# PS2 Memory Card Inspector $MCI_VERSION" RELEASE_NOTES.md
          strings "artifacts/$MCI_ASSET" | grep -q "v$MCI_VERSION"

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: PS2-Memory-Card-Inspector-${{ env.MCI_VERSION }}-Drebin-${{ github.sha }}
          path: |
            artifacts/${{ env.MCI_ASSET }}
            artifacts/MC_INSPECTOR-${{ env.MCI_VERSION }}-Drebin.zip
          if-no-files-found: error
          retention-days: 3

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$MCI_VERSION-Drebin"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it untouched."
            exit 0
          fi
          # Versions with a suffix (0.4.2-rc1, 0.5.0-beta2) are pre-releases
          # and never become "Latest".
          EXTRA=()
          TITLE="$MCI_VERSION - Drebin"
          case "$MCI_VERSION" in
            *-*) EXTRA+=(--prerelease --latest=false)
                 TITLE="$MCI_VERSION - Drebin (pre-release)" ;;
          esac
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file RELEASE_NOTES.md \
            "${EXTRA[@]}" \
            "artifacts/$MCI_ASSET" \
            "artifacts/MC_INSPECTOR-$MCI_VERSION-Drebin.zip"
