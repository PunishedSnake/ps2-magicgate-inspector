name: P0 Export Direct Slot Full Matrix

on:
  workflow_dispatch:
  push:
    branches:
      - perf/p0-export-direct-write-slot
    paths:
      - 'src/card_image.c'
      - 'src/image_write_behind.c'
      - 'src/image_write_behind.h'
      - 'Makefile'
      - '.github/workflows/p0-export-direct-slot-full.yml'

permissions:
  contents: read

env:
  QUALIFIED_SHA: 850a4eb9bbc513787d456c8dc4d80de8c22f54bc
  COPY_ELISION_SHA: f67b59853cd5606cafaa021f8378759c7ad210d0
  PS2SDK_SECURITY_COMMIT: a13b5971ec0e39c7ba8b8559b80a4e81c8425352

jobs:
  full-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout direct-slot candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Materialize comparison worktrees
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$QUALIFIED_SHA" "$COPY_ELISION_SHA"
          mkdir -p .build/worktrees artifacts/p0-export-direct-slot-full
          git worktree add --detach .build/worktrees/qualified "$QUALIFIED_SHA"
          git worktree add --detach .build/worktrees/copy-elision "$COPY_ELISION_SHA"

      - name: Stage pinned PS2SDK personalities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/ps2sdk2-mg .build/ps2sdk2-secr14 .build/ps2sdk2-raw
          docker pull ps2dev/ps2dev:v2.0.0
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e PS2SDK_SECURITY_COMMIT="$PS2SDK_SECURITY_COMMIT" \
            ps2dev/ps2dev:v2.0.0 \
            sh -c 'set -eu; \
              apk add --no-cache git python3 build-base >/dev/null; \
              for f in freesio2.irx freepad.irx mcman.irx mcserv.irx; do cp "/usr/local/ps2dev/ps2sdk/iop/irx/$f" "/work/.build/ps2sdk2-mg/$f"; done; \
              git init -q /tmp/ps2sdk-src; \
              git -C /tmp/ps2sdk-src remote add origin https://github.com/ps2dev/ps2sdk.git; \
              git -C /tmp/ps2sdk-src fetch -q --depth 1 origin "$PS2SDK_SECURITY_COMMIT"; \
              git -C /tmp/ps2sdk-src checkout -q FETCH_HEAD; \
              python3 /work/tools/patch_secrman14_diag.py /tmp/ps2sdk-src/iop/security/secrman; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/security/secrman clean all; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/security/secrsif clean all; \
              cp /tmp/ps2sdk-src/iop/security/secrman/irx/secrman.irx /work/.build/ps2sdk2-secr14/secrman.irx; \
              cp /tmp/ps2sdk-src/iop/security/secrsif/irx/secrsif.irx /work/.build/ps2sdk2-secr14/secrsif.irx; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/memorycard/mcman clean; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/memorycard/mcman all MCMAN_BUILDING_XMCMAN=0 MCMAN_BUILDING_XMCMAN_V2=0; \
              python3 /work/tools/patch_raw_mcserv_ports.py /tmp/ps2sdk-src/iop/memorycard/mcserv/src/mcserv.c; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/memorycard/mcserv clean; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/memorycard/mcserv all MCMAN_BUILDING_XMCSERV=0; \
              cp /tmp/ps2sdk-src/iop/memorycard/mcman/irx/mcman.irx /work/.build/ps2sdk2-raw/mcman.irx; \
              cp /tmp/ps2sdk-src/iop/memorycard/mcserv/irx/mcserv.irx /work/.build/ps2sdk2-raw/mcserv.irx'
          for tree in .build/worktrees/qualified .build/worktrees/copy-elision; do
            mkdir -p "$tree/.build"
            cp -a .build/ps2sdk2-mg "$tree/.build/"
            cp -a .build/ps2sdk2-secr14 "$tree/.build/"
            cp -a .build/ps2sdk2-raw "$tree/.build/"
          done

      - name: Build qualified and copy-elision baselines
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work \
            ps2dev/ps2dev:v2.0.0 sh -c 'set -eu; \
              apk add --no-cache build-base >/dev/null; \
              FLAGS="R5900_BENCH=0 RAW_BULK_PAGES=16 RAW_BULK_ASYNC=0 IMAGE_READ_PAGES=32 IMAGE_WRITE_PAGES=32 IMAGE_WRITE_ASYNC=0"; \
              build_tree() { \
                path="$1"; name="$2"; \
                cd "/work/$path"; \
                make $FLAGS MC_INSPECTOR.ELF; \
                cp MC_INSPECTOR.ELF "/work/artifacts/p0-export-direct-slot-full/$name.ELF"; \
                mips64r5900el-ps2-elf-size MC_INSPECTOR.ELF > "/work/artifacts/p0-export-direct-slot-full/$name.size.txt"; \
                cd /work; \
              }; \
              build_tree .build/worktrees/qualified qualified-sync32; \
              build_tree .build/worktrees/copy-elision copy-elision-sync32'

      - name: Build direct-slot synchronous and async compatibility candidates
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work \
            ps2dev/ps2dev:v2.0.0 sh -c 'set -eu; \
              apk add --no-cache build-base >/dev/null; \
              COMMON="R5900_BENCH=0 RAW_BULK_PAGES=16 RAW_BULK_ASYNC=0 IMAGE_READ_PAGES=32 IMAGE_WRITE_PAGES=32"; \
              make $COMMON IMAGE_WRITE_ASYNC=0 MC_INSPECTOR.ELF; \
              cp MC_INSPECTOR.ELF artifacts/p0-export-direct-slot-full/direct-slot-sync32.ELF; \
              mips64r5900el-ps2-elf-size MC_INSPECTOR.ELF > artifacts/p0-export-direct-slot-full/direct-slot-sync32.size.txt; \
              rm -f src/image_write_behind.o MC_INSPECTOR.ELF; \
              make $COMMON IMAGE_WRITE_ASYNC=1 MC_INSPECTOR.ELF; \
              cp MC_INSPECTOR.ELF artifacts/p0-export-direct-slot-full/direct-slot-async32-compat.ELF; \
              mips64r5900el-ps2-elf-size MC_INSPECTOR.ELF > artifacts/p0-export-direct-slot-full/direct-slot-async32-compat.size.txt'

      - name: Write controlled hardware protocol
        shell: bash
        run: |
          set -euo pipefail
          cat > artifacts/p0-export-direct-slot-full/README.txt <<'EOF'
          P0 export producer-to-final-write-slot matrix

          A qualified-sync32.ELF
            qualified dev4 baseline, synchronous 32-record USB write batch

          B copy-elision-sync32.ELF
            removes the first redundant 512-byte per-page export copy only

          C direct-slot-sync32.ELF
            inherits B and additionally lets card acquisition fill the final
            write-behind record directly, eliminating the record-to-batch copy

          D direct-slot-async32-compat.ELF
            compile/runtime compatibility candidate only. It also enables the
            separate one-deep USB write NOWAIT axis and must NOT be used as the
            primary copy-elision A/B.

          Primary hardware comparisons:
            A vs B: first 512-byte copy removal
            B vs C: final write-slot copy removal
            A vs C: combined producer/consumer copy reduction

          For an 8 MiB card (16384 pages):
            A -> B removes 8,388,608 bytes of EE copy traffic for .ps2.
            B -> C removes 8,650,752 bytes for .ps2 or 8,388,608 bytes for .vmc.
            A -> C removes 17,039,360 bytes for .ps2.

          Keep SCPH/revision, card, USB device, filesystem, IRX set and workload
          fixed. Test .vmc and .ps2 separately. Require identical output size,
          logical CRC, ECC result and verified=1 before timing is considered.
          Record operation wall time and RAW-BULK/IMAGE-IO p50/p95/p99/max.
          Real PS2 timing decides promotion; PCSX2 is correctness-only here.
          EOF
          {
            echo "qualified=$QUALIFIED_SHA"
            echo "copy_elision=$COPY_ELISION_SHA"
            echo "direct_slot=$GITHUB_SHA"
            echo "ps2sdk=$PS2SDK_SECURITY_COMMIT"
          } > artifacts/p0-export-direct-slot-full/REVISIONS.txt
          sha256sum artifacts/p0-export-direct-slot-full/*.ELF > artifacts/p0-export-direct-slot-full/SHA256SUMS.txt
          file artifacts/p0-export-direct-slot-full/*.ELF
          cat artifacts/p0-export-direct-slot-full/*.size.txt

      - name: Upload full matrix
        uses: actions/upload-artifact@v4
        with:
          name: PS2-MCI-P0-export-direct-full-${{ github.sha }}
          path: artifacts/p0-export-direct-slot-full/
          if-no-files-found: error
          retention-days: 30
