name: P0 Raw Pipeline A-B

on:
  workflow_dispatch:
  push:
    branches:
      - feat/0.4.0-dev4-save-transfer-picker-impl4
    paths:
      - 'src/raw_bulk_read.c'
      - 'src/raw_bulk_read.h'
      - 'src/card_raw_session.c'
      - 'tools/patch_raw_mcserv_ports.py'
      - 'Makefile'
      - '.github/workflows/p0-raw-pipeline-ab.yml'

permissions:
  contents: read

env:
  PS2SDK_SECURITY_COMMIT: a13b5971ec0e39c7ba8b8559b80a4e81c8425352

jobs:
  build-ab-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage pinned PS2SDK personalities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/ps2sdk2-mg .build/ps2sdk2-secr14 .build/ps2sdk2-raw
          docker pull ps2dev/ps2dev:v2.0.0
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e PS2SDK_SECURITY_COMMIT="$PS2SDK_SECURITY_COMMIT" \
            ps2dev/ps2dev:v2.0.0 \
            sh -c 'set -eu; \
              apk add --no-cache git python3 build-base >/dev/null; \
              for f in freesio2.irx freepad.irx mcman.irx mcserv.irx; do cp "/usr/local/ps2dev/ps2sdk/iop/irx/$f" "/work/.build/ps2sdk2-mg/$f"; done; \
              git init -q /tmp/ps2sdk-src; \
              git -C /tmp/ps2sdk-src remote add origin https://github.com/ps2dev/ps2sdk.git; \
              git -C /tmp/ps2sdk-src fetch -q --depth 1 origin "$PS2SDK_SECURITY_COMMIT"; \
              git -C /tmp/ps2sdk-src checkout -q FETCH_HEAD; \
              python3 /work/tools/patch_secrman14_diag.py /tmp/ps2sdk-src/iop/security/secrman; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/security/secrman clean all; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/security/secrsif clean all; \
              cp /tmp/ps2sdk-src/iop/security/secrman/irx/secrman.irx /work/.build/ps2sdk2-secr14/secrman.irx; \
              cp /tmp/ps2sdk-src/iop/security/secrsif/irx/secrsif.irx /work/.build/ps2sdk2-secr14/secrsif.irx; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/memorycard/mcman clean; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/memorycard/mcman all MCMAN_BUILDING_XMCMAN=0 MCMAN_BUILDING_XMCMAN_V2=0; \
              python3 /work/tools/patch_raw_mcserv_ports.py /tmp/ps2sdk-src/iop/memorycard/mcserv/src/mcserv.c; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/memorycard/mcserv clean; \
              PS2SDKSRC=/tmp/ps2sdk-src make -C /tmp/ps2sdk-src/iop/memorycard/mcserv all MCMAN_BUILDING_XMCSERV=0; \
              cp /tmp/ps2sdk-src/iop/memorycard/mcman/irx/mcman.irx /work/.build/ps2sdk2-raw/mcman.irx; \
              cp /tmp/ps2sdk-src/iop/memorycard/mcserv/irx/mcserv.irx /work/.build/ps2sdk2-raw/mcserv.irx'

      - name: Build controlled 2x2 raw-pipeline matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/p0-raw-ab
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            ps2dev/ps2dev:v2.0.0 \
            sh -c 'set -eu; \
              apk add --no-cache build-base >/dev/null; \
              build_variant() { \
                name="$1"; pages="$2"; async="$3"; \
                rm -f src/raw_bulk_read.o MC_INSPECTOR.ELF; \
                make R5900_BENCH=0 RAW_BULK_PAGES="$pages" RAW_BULK_ASYNC="$async" MC_INSPECTOR.ELF; \
                cp MC_INSPECTOR.ELF "/work/artifacts/p0-raw-ab/$name.ELF"; \
              }; \
              build_variant MC_INSPECTOR-sync16 16 0; \
              build_variant MC_INSPECTOR-sync8 8 0; \
              build_variant MC_INSPECTOR-async16 16 1; \
              build_variant MC_INSPECTOR-async8 8 1'

      - name: Write hardware A-B protocol
        shell: bash
        run: |
          cat > artifacts/p0-raw-ab/README-P0-RAW-AB.txt <<'EOF'
          P0 raw-card pipeline hardware A/B matrix

          Common source revision: this workflow's GITHUB_SHA.
          Synthetic R5900 benchmark: disabled in every variant.
          Pinned PS2SDK source: a13b5971ec0e39c7ba8b8559b80a4e81c8425352.

          A  MC_INSPECTOR-sync16.ELF   16 pages / 8192 B, blocking RPC
          B  MC_INSPECTOR-sync8.ELF     8 pages / 4096 B, blocking RPC
          C  MC_INSPECTOR-async16.ELF  16 pages / 8192 B, one NOWAIT prefetch
          D  MC_INSPECTOR-async8.ELF    8 pages / 4096 B, one NOWAIT prefetch

          Comparisons:
          A vs B isolates batch/working-set size.
          A vs C isolates overlap at the 8 KiB batch size.
          B vs D isolates overlap at the 4 KiB batch size.
          C vs D compares cache pressure versus additional RPC frequency under overlap.

          Keep card, USB device, port, image format and workload identical.
          Correctness gate: resulting logical CRC and full image verification must match.
          Record RAW-BULK-PERF and IMAGE end lines from DREBIN.LOG.
          For repeated qualification report operation p50/p95/p99/max, not only average throughput.
          Do not promote an async candidate to the production defaults from PCSX2 timing alone.
          EOF
          printf 'Project revision: %s\n' "$GITHUB_SHA" > artifacts/p0-raw-ab/REVISION.txt
          sha256sum artifacts/p0-raw-ab/*.ELF | tee artifacts/p0-raw-ab/SHA256SUMS.txt
          file artifacts/p0-raw-ab/*.ELF
          ls -lh artifacts/p0-raw-ab/*.ELF

      - name: Upload P0 raw pipeline matrix
        uses: actions/upload-artifact@v4
        with:
          name: PS2-MCI-P0-raw-pipeline-AB-${{ github.sha }}
          path: artifacts/p0-raw-ab/
          if-no-files-found: error
          retention-days: 30
