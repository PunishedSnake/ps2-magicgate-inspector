name: P0 Image FS FAT Cache Static Audit

on:
  workflow_dispatch:
  push:
    branches:
      - perf/p0-image-fs-fat-cache
    paths:
      - 'src/card_image_fs.c'
      - 'tools/patch_card_image_fs_meta_cache.py'
      - '.github/workflows/p0-image-fs-fat-cache-static.yml'

permissions:
  contents: read

env:
  DIRECT_SLOT_BASE_SHA: c88f50787b15bf253e11e5bc75017ac1ed4cdd79

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compile no-inline baseline and candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/fat-static artifacts/p0-image-fs-fat-cache-static
          git fetch --no-tags --depth=1 origin "$DIRECT_SLOT_BASE_SHA"
          git show "$DIRECT_SLOT_BASE_SHA:src/card_image_fs.c" > .build/fat-static/baseline.c
          cp src/card_image_fs.c .build/fat-static/candidate.c
          python3 tools/patch_card_image_fs_meta_cache.py .build/fat-static/candidate.c
          if grep -A45 'static int FatEntry' .build/fat-static/candidate.c | grep -q 'unsigned char cluster\[FS_MAX_CLUSTER_BYTES\]'; then
            echo 'ERROR: candidate still owns per-call metadata cluster scratch'; exit 1
          fi
          docker pull ps2dev/ps2dev:v2.0.0
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work \
            ps2dev/ps2dev:v2.0.0 sh -c '
              set -eu
              CFLAGS="-D_EE -DNEWLIB_PORT_AWARE -G0 -O2 -Wall -Wextra -std=gnu99 -fdata-sections -ffunction-sections -DMG_SECR_PROFILE_PS2SDK14=1 -fno-inline -fno-inline-functions -fno-inline-small-functions"
              INCS="-I/usr/local/ps2dev/ps2sdk/ee/include -I/usr/local/ps2dev/ps2sdk/common/include -Isrc -I."
              mips64r5900el-ps2-elf-gcc $CFLAGS $INCS -c .build/fat-static/baseline.c -o .build/fat-static/baseline.o
              mips64r5900el-ps2-elf-gcc $CFLAGS $INCS -c .build/fat-static/candidate.c -o .build/fat-static/candidate.o
              mips64r5900el-ps2-elf-nm -S .build/fat-static/baseline.o | grep FatEntry
              mips64r5900el-ps2-elf-nm -S .build/fat-static/candidate.o | grep FatEntry
              mips64r5900el-ps2-elf-nm -S .build/fat-static/candidate.o | grep ReadMetaClusterCached
              if mips64r5900el-ps2-elf-nm -u .build/fat-static/candidate.o | grep -q ReadMetaClusterCached; then
                echo "ERROR: metadata cache helper unresolved"; exit 1
              fi
              {
                echo "== sizes =="
                mips64r5900el-ps2-elf-size .build/fat-static/baseline.o .build/fat-static/candidate.o
                echo
                echo "== baseline FatEntry =="
                mips64r5900el-ps2-elf-nm -S .build/fat-static/baseline.o | grep FatEntry
                echo "== candidate FatEntry/cache =="
                mips64r5900el-ps2-elf-nm -S .build/fat-static/candidate.o | grep -E "FatEntry|ReadMetaClusterCached"
              } > artifacts/p0-image-fs-fat-cache-static/STATIC_REPORT.txt
              mips64r5900el-ps2-elf-objdump -dr --disassemble=FatEntry .build/fat-static/baseline.o > artifacts/p0-image-fs-fat-cache-static/FatEntry-baseline.S
              mips64r5900el-ps2-elf-objdump -dr --disassemble=FatEntry .build/fat-static/candidate.o > artifacts/p0-image-fs-fat-cache-static/FatEntry-candidate.S
              mips64r5900el-ps2-elf-objdump -dr --disassemble=ReadMetaClusterCached .build/fat-static/candidate.o > artifacts/p0-image-fs-fat-cache-static/ReadMetaClusterCached.S
            '
          cat artifacts/p0-image-fs-fat-cache-static/STATIC_REPORT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PS2-MCI-P0-image-fs-fat-cache-static-${{ github.sha }}
          path: artifacts/p0-image-fs-fat-cache-static/
          if-no-files-found: error
          retention-days: 30